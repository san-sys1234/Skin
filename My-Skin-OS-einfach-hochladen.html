<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ef">
<title>My Skin OS ✨</title>
<style>
:root{--bg:#f7f3ef;--card:#fff;--ink:#292522;--muted:#766f69;--line:#e7ded7;--accent:#a96f62;--soft:#f1e7e1;--good:#47755c;--bad:#a74c4c;--shadow:0 8px 28px rgba(55,40,30,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:900px;margin:auto;padding:18px 16px 50px}
header{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;padding:10px 2px 18px}h1{margin:0;font-size:29px;letter-spacing:-.7px}h2{margin:0 0 8px;font-size:20px}h3{margin:0 0 5px;font-size:16px}p{margin:6px 0}.muted{color:var(--muted)}.age{text-align:right;color:var(--muted)}.age b{color:var(--ink);font-size:21px}.age small{display:block}
nav{display:flex;gap:7px;overflow:auto;padding:4px 0 14px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:4}nav button{white-space:nowrap;padding:9px 13px;border-radius:999px;background:#eee6e0;color:#625b56}nav button.active{background:var(--ink);color:white}
.card,.hero,.notice{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0;box-shadow:var(--shadow)}.hero{display:flex;justify-content:space-between;gap:15px;align-items:center;background:linear-gradient(135deg,#fff,#f3e8e2)}.hero select{max-width:220px;padding:10px;border:1px solid var(--line);border-radius:12px;background:white}.notice{background:#f3ece7;box-shadow:none}
.check{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.check:first-of-type{border-top:0}.check input{width:20px;height:20px;accent-color:var(--accent);margin-top:1px}.pill{display:inline-block;border-radius:999px;padding:3px 8px;background:#eee6e0;color:#635b56;font-size:12px;margin:3px 4px 0 0}.pill.buy{background:#f6e4d9;color:#8b4c39}.bad{color:var(--bad)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.primary,.secondary,.delete{border-radius:12px;padding:10px 13px}.primary{background:var(--ink);color:#fff}.secondary{background:#eee7e2;color:var(--ink)}.small{padding:7px 10px;font-size:13px}.delete{background:#f7e9e8;color:#a34e4e;font-size:18px;padding:6px 9px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px;margin:5px 0;color:var(--ink)}textarea{min-height:120px;resize:vertical}.search{max-width:230px}
.product,.shopping,.treat,.road,.day,.journal{border-top:1px solid var(--line);padding:14px 0}.product:first-child,.shopping:first-child{border-top:0}.product .row>div:first-child{flex:1}.upload{display:block;border:1.5px dashed #cdbdb3;border-radius:14px;padding:14px;text-align:center;background:#fbf7f4;margin:8px 0;color:#655c56}.upload input,.import input{display:none}.photoBox{display:flex;gap:12px;align-items:center;background:#faf7f5;padding:10px;border-radius:14px}.photoBox img{width:82px;height:82px;object-fit:cover;border-radius:10px}.analysis{background:#f4ece7;border-radius:14px;padding:14px;margin-top:12px}.warning{color:#8f4d3d;background:#fae9e3;padding:8px;border-radius:10px}.empty{text-align:center;padding:25px;color:var(--muted)}footer{text-align:center;color:#8b827b;font-size:12px;padding:20px}.toast{position:fixed;left:16px;right:16px;bottom:18px;background:#292522;color:white;padding:13px 16px;border-radius:14px;text-align:center;z-index:20;box-shadow:var(--shadow)}
@media(max-width:600px){.wrap{padding:12px 12px 40px}header{padding-top:5px}.hero{align-items:flex-start;flex-direction:column}.hero select{max-width:none;width:100%}.search{max-width:none}.card{padding:15px}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>My Skin OS ✨</h1><p class="muted">Deine Hautpflege, dein Alter, deine Lebensphase.</p></div><div class="age">34 → <b>35</b><small>November 2026</small></div></header>
<nav id="nav"></nav>
<main id="app"></main>
<footer>My Skin OS · lokal im Browser · konservativ bei Unsicherheit</footer>
</div>
<script>
const KEY='my-skin-os-static-v1';
const seed=[
{id:'niacinamide-fresh',name:'5% Niacinamid-Serum (Neu kaufen)',cat:'Serum',tags:['niacinamide'],state:'zu kaufen',active:false,owned:false,needed:true},
{id:'niacinamide-old',name:'Nø Cosmetics 120h Hydration & Niacinamide Serum',cat:'Serum',tags:['niacinamide','hyaluronic_acid'],state:'abgelaufen',active:false,owned:true,needed:true},
{id:'hyaluron',name:'Nø Cosmetics Hyperhydration Hyaluron Serum',cat:'Serum',tags:['hyaluronic_acid','hydration'],state:'behalten',active:true,owned:true},
{id:'masam',name:'M. Asam AQUA INTENSE Supreme Hyaluron Cream',cat:'Creme',tags:['hydration','hyaluronic_acid'],state:'behalten',active:true,owned:true},
{id:'spf',name:'Lancaster Sun Beauty SPF 50',cat:'SPF',tags:['spf50','uv_protection'],state:'behalten',active:true,owned:true},
{id:'nivea',name:'NIVEA Creme / NIVEA Soft',cat:'Creme',tags:['hydration'],state:'nach Bedarf',active:true,owned:true},
{id:'genifique',name:'Lancôme Advanced Génifique',cat:'Serum',tags:['hydration','barrier'],state:'optional',active:true,owned:true},
{id:'ultimune',name:'Shiseido Ultimune',cat:'Serum',tags:['hydration','barrier'],state:'optional',active:true,owned:true},
{id:'chanel-hydra',name:'Chanel Hydra Beauty Micro Serum',cat:'Serum',tags:['hydration'],state:'optional',active:true,owned:true},
{id:'bha',name:"Paula's Choice 2% BHA Liquid",cat:'Peeling',tags:['bha','salicylic_acid','pores'],state:'bei Unreinheiten',active:true,owned:true},
{id:'aha',name:'Garnier PHA + Glycolsäure Mizellen-Peelingwasser',cat:'Peeling',tags:['pha','glycolic_acid','exfoliation'],state:'1×/Woche',active:true,owned:true},
{id:'chanel-exfol',name:'Chanel Sublimage Lotion Lumière Exfoliante',cat:'Peeling',tags:['exfoliation'],state:'prüfen',active:true,owned:true},
{id:'retinol',name:'Nø Cosmetics Retinol Serum',cat:'Retinoid',tags:['retinol','retinoid'],state:'pausiert',active:false,owned:true},
{id:'arcaya',name:'arçaya Ampullen',cat:'Ampulle',tags:['hydration','repair'],state:'gelegentlich',active:true,owned:true},
{id:'eye',name:'Skin Systeme Hydrate SOS Eye Cream',cat:'Augenpflege',tags:['hydration'],state:'optional',active:true,owned:true},
{id:'rituals-cleanse',name:'Rituals Reinigungs-/Mizellenprodukt',cat:'Reinigung',tags:['cleansing'],state:'aufbrauchen',active:true,owned:true},
{id:'masks',name:'Verschiedene Feuchtigkeitsmasken / Augenpads',cat:'Maske',tags:['hydration','mask'],state:'Wellness',active:true,owned:true}
];
const phases={breastfeeding:['🍼 Stillzeit','Basis: Feuchtigkeit, Niacinamid und täglicher SPF. Retinoide pausieren.'],ttc:['🥰 Kinderwunsch','Routine stabil halten; Retinoide nicht aktivieren.'],pregnancy:['🤰 Schwangerschaft','Sanfte Basics + SPF; Retinoide vermeiden.'],post:['✨ Nach Stillzeit','Wenn keine Schwangerschaft geplant ist: Retinoid langsam und kontrolliert aufbauen.']};
const tagMeta={retinoid:'Retinoid',niacinamide:'Niacinamid',vitamin_c:'Vitamin C',hyaluronic_acid:'Hyaluron',aha:'AHA',pha:'PHA',bha:'BHA',ceramides:'Ceramide',peptides:'Peptide',spf50:'SPF 50+',cleansing:'Reinigung',mask:'Maske',exfoliation:'Peeling',hydration:'Feuchtigkeit',barrier:'Barriereschutz',repair:'Repair'};
const shoppingDefaults=[
{id:'shop-niacinamide',name:'Frisches 4–5% Niacinamid-Serum',reason:'Dein bisheriges Niacinamid-Serum ist abgelaufen und soll die Basisroutine vervollständigen.',priority:'hoch',tags:['niacinamide'],bought:false},
{id:'shop-cleanser',name:'Sanfter Gesichtsreiniger',reason:'Für eine zuverlässige, hautschonende Reinigung morgens/abends.',priority:'mittel',tags:['cleansing'],bought:false}
];
const rules=[
[/retinol|retinal|tretinoin|adapalene|retinoid/,'retinoid'],[/niacinamide/,'niacinamide'],[/vitamin\\s*c|ascorbic|ascorbyl/,'vitamin_c'],[/hyaluron|hyaluronic/,'hyaluronic_acid'],[/glycolic|lactic|mandelic|aha/,'aha'],[/pha|gluconolactone|lactobionic/,'pha'],[/salicylic|bha/,'bha'],[/ceramide/,'ceramides'],[/peptide/,'peptides'],[/spf\\s*([3-9]\\d)|sun protection|sunscreen/,'spf50'],[/cleanser|reiniger|reinigung|micellar|mizellen/,'cleansing'],[/maske|mask|patch|pads/,'mask']];
const blockedPhases=['breastfeeding','ttc','pregnancy'];
let state=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)return x}catch(e){}return{tab:'today',phase:'breastfeeding',products:seed,checks:{},shopping:shoppingDefaults,journal:[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}
function analyze(name,inci=''){const text=(name+' '+inci).toLowerCase(),tags=[...new Set(rules.filter(x=>x[0].test(text)).map(x=>x[1]))];if(/glycerin|betaine|panthenol|hyaluron/.test(text)&&!tags.includes('hydration'))tags.push('hydration');if(/exfoliat|peel|peeling/.test(text)&&!tags.includes('exfoliation'))tags.push('exfoliation');const blocked=tags.includes('retinoid')&&blockedPhases.includes(state.phase);let cat=tags.includes('retinoid')?'Retinoid':tags.includes('spf50')?'SPF':tags.some(t=>['aha','pha','bha','exfoliation'].includes(t))?'Peeling':tags.includes('cleansing')?'Reinigung':tags.includes('mask')?'Maske':/cream|creme|moistur|lotion/i.test(text)?'Creme':'Serum';let slot='Manuell prüfen',reason='Die INCI ist nicht eindeutig genug. Bitte vollständig prüfen.';if(tags.includes('cleansing'))[slot,reason]=['Morgens/abends · Reinigung','Vor Seren und Cremes.'];else if(tags.includes('spf50'))[slot,reason]=['Morgens · letzter Schritt','Täglich großzügig und als letzten Pflegeschritt anwenden.'];else if(blocked)[slot,reason]=['Pausieren · aktuell nicht aktivieren','Enthält ein Retinoid; in deiner aktuellen Lebensphase nicht als Routinewirkstoff einplanen.'];else if(tags.includes('retinoid'))[slot,reason]=['Abends · langsam einschleichen','Nur nach der passenden Lebensphase und bei Unsicherheit nach fachlicher Rücksprache.'];else if(tags.some(t=>['aha','pha','bha','exfoliation'].includes(t)))[slot,reason]=['Abends · Peelingabend','Nicht mehrere Peelings am selben Abend kombinieren. Bei Reizung pausieren.'];else if(tags.includes('vitamin_c'))[slot,reason]=['Morgens · vor Creme/SPF','Optionaler antioxidativer Schritt.'];else if(tags.includes('niacinamide'))[slot,reason]=['Morgens · nach Reinigung','Passt gut in die einfache Basisroutine.'];else if(tags.some(t=>['hyaluronic_acid','ceramides','peptides'].includes(t)))[slot,reason]=['Morgens oder abends · vor Creme','Pflege-/Barriereschritt.'];const conflicts=[];if(tags.includes('retinoid')&&tags.some(t=>['aha','pha','bha','exfoliation'].includes(t)))conflicts.push('Retinoid + Peeling: nicht am selben Abend.');if(tags.filter(t=>['aha','pha','bha','exfoliation'].includes(t)).length>=2)conflicts.push('Mehrere Peeling-Wirkstoffe erkannt: langsam und getrennt einsetzen.');return{tags,cat,slot,reason,blocked,conflicts}}
function available(tag){return state.products.some(p=>p.active!==false&&p.owned!==false&&p.state!=='abgelaufen'&&(p.tags||[]).includes(tag))}
function routine(){return{am:[['Kurz reinigen/abspülen',true,'am0'],['Niacinamid',available('niacinamide'),'am1'],['M. Asam Hyaluron Cream',available('hydration'),'am2'],['Lancaster SPF 50',available('spf50'),'am3']],pm:[['Reinigen',available('cleansing'),'pm0'],['Nø Hyaluron Serum',available('hyaluronic_acid'),'pm1'],['M. Asam Hyaluron Cream',available('hydration'),'pm2']]}}
function nav(){const items=[['today','Heute'],['week','Woche'],['products','Produkte'],['shopping','Einkaufen'],['roadmap','Jahre'],['treatments','Treatments'],['settings','Mehr']];document.getElementById('nav').innerHTML=items.map(x=>`<button class="${state.tab===x[0]?'active':''}" data-tab="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;save();render()})}
function routineBlock(title,items){return `<section class="card"><h2>${title}</h2>${items.map(x=>`<label class="check"><input type="checkbox" ${state.checks[x[2]]?'checked':''} ${x[1]?'':'disabled'} data-check="${x[2]}"><span>${esc(x[0])} ${x[1]?'':'<span class="pill buy">🛍️ fehlt · kaufen</span>'}</span></label>`).join('')}</section>`}
function renderToday(){const r=routine(),open=state.shopping.filter(x=>!x.bought);return `<div class="hero"><div><h2>Heute 🥰</h2><p><b>${phases[state.phase][0]}</b> · ${phases[state.phase][1]}</p></div><select id="phase">${Object.entries(phases).map(([k,v])=>`<option value="${k}" ${k===state.phase?'selected':''}>${v[0]}</option>`).join('')}</select></div><div class="card"><h2>🛍️ Was dir noch fehlt</h2><p class="muted">Alles, was für die Basisroutine vorgesehen ist, aber noch nicht verfügbar ist.</p>${open.slice(0,4).map(x=>`<div class="shopping"><div><b>${esc(x.name)}</b><small class="muted" style="display:block">${esc(x.reason)}</small></div><button class="secondary small" data-go="shopping">Zur Liste</button></div>`).join('')||'<p>✨ Deine Einkaufsliste ist aktuell leer.</p>'}</div>${routineBlock('☀️ Morgen',r.am)}${routineBlock('🌙 Abend',r.pm)}<div class="notice">💡 <b>Anti-Aging-Fokus:</b> SPF konsequent. Stärkere Wirkstoffe kommen erst in die passende Lebensphase – nicht alles gleichzeitig.</div><div class="card"><div class="row"><div><h2>Haut-Tagebuch</h2><p class="muted">Ein kurzer Eintrag reicht.</p></div><button class="secondary" id="journalAdd">＋ Heute dokumentieren</button></div>${state.journal.slice(0,3).map(j=>`<div class="journal"><b>${esc(j.date)}</b>${j.note?` · ${esc(j.note)}`:''}</div>`).join('')}</div>`}
function renderWeek(){return `<h2>Wochenplan</h2>${['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'].map((d,i)=>`<div class="card day"><b>${d}</b><p>☀️ Niacinamid → Creme → SPF 50</p><p>🌙 ${i===3?'PHA/Glycol → Hyaluron → Creme':i===5?'Feuchtigkeitsmaske → Creme':'Hyaluron → Creme'}</p></div>`).join('')}<div class="notice">⚠️ Peeling-Abend nur bei ruhiger Haut. BHA und AHA/PHA nicht zusätzlich stapeln.</div>`}
function renderProducts(){const p=state.products;return `<div class="card"><h2>📷 Produkt-Scanner</h2><p class="muted">Foto vom Etikett aufnehmen. Der erkannte Text kann vor der Analyse korrigiert werden.</p><label class="upload">📷 Foto aufnehmen / auswählen<input id="photo" type="file" accept="image/*" capture="environment"></label><div id="photoArea"></div><input id="pname" placeholder="Produktname"><textarea id="inci" placeholder="Vollständige INCI hier einfügen (je vollständiger, desto besser)"></textarea><button class="primary" id="analyze">🔎 Analysieren</button><div id="analysis"></div></div><div class="card"><div class="row"><div><h2>Meine Sammlung</h2><p class="muted">⏸️ Deaktivieren = behalten, aber nicht verwenden. 🗑️ Ausmisten = vollständig entfernen.</p></div><input class="search" id="filter" placeholder="Suchen…"></div><div id="productList">${p.map(productCard).join('')}</div></div>`}
function productCard(p){const a=analyze(p.name,p.inci||'');return `<div class="product" data-product="${esc(p.name.toLowerCase())}"><div class="row"><div><h3>${esc(p.name)}</h3>${(p.tags||[]).map(t=>`<span class="pill">${esc(tagMeta[t]||t)}</span>`).join('')}</div><div class="row"><button class="secondary small" data-toggle="${p.id}">${p.active?'Deaktivieren':'Aktivieren'}</button><button class="delete" title="Ausmisten" data-delete="${p.id}">🗑️</button></div></div><p class="${p.state==='abgelaufen'?'bad':''}"><b>${esc(p.state||'')}</b> ${p.owned===false?'<span class="pill">noch nicht gekauft</span>':''}</p><p><b>Vorschlag:</b> ${a.blocked?'pausieren':esc(a.slot)}</p>${(p.owned===false||p.state==='zu kaufen'||p.state==='abgelaufen')?`<button class="secondary small" data-buy="${p.id}">🛍️ Auf Einkaufsliste</button>`:''}</div>`}
function renderShopping(){const open=state.shopping.filter(x=>!x.bought);return `<div class="hero"><div><h2>🛍️ Einkaufen</h2><p>Fehlende Produkte bleiben sichtbar, bis sie erledigt sind.</p></div><span class="pill">${open.length} offen</span></div><div class="card"><h2>Für deine aktuelle Routine</h2>${open.length?open.map(x=>`<div class="shopping"><div><h3>${esc(x.name)}</h3><p>${esc(x.reason)}</p><span class="pill">Priorität: ${esc(x.priority)}</span></div><button class="secondary small" data-bought="${x.id}">✓ Erledigt</button></div>`).join(''):'<div class="empty">✨ Aktuell fehlt nichts Wesentliches.</div>'}</div><div class="card"><h2>📝 Eigenen Einkauf ergänzen</h2><div class="row"><input id="shopInput" placeholder="z. B. mineralischer SPF 50"><button class="primary" id="shopAdd">＋ Hinzufügen</button></div></div><div class="card"><h2>💡 Wichtig</h2><p>„Gekauft“ macht ein Produkt noch nicht zu einem vorhandenen Produkt. Erst beim Scanner hinzufügen, dann kann es in die Routine einfließen.</p></div>`}
function renderRoadmap(){const roadmap=[['34–35 · 2026/27','Basis','Stillzeit: Feuchtigkeit, Niacinamid, SPF 50; sanftes Peeling höchstens 1×/Woche.'],['35–37','Kinderwunsch / Schwangerschaft / Stillzeit','Routine stabil halten; Retinoide pausieren.'],['37–38+','Nach letzter Stillzeit','Wenn keine Schwangerschaft geplant ist: Retinoid langsam aufbauen.'],['38–40','Hautqualität','Bei Bedarf Peelings, Microneedling oder Laser mit qualifizierter Fachperson besprechen.'],['40–42','Erhaltung','SPF + Retinoid als Fundament; Treatments nur mit konkretem Ziel.'],['42–45+','Individuell','Konservatives Botulinumtoxin bei mimischen Falten optional; Filler nur bei echtem Volumenverlust.']];return `<div class="card"><h2>Dein Lebensplan</h2><p>Geboren <b>November 1991</b> · 35 im November 2026.</p>${roadmap.map(x=>`<div class="road"><b>${x[0]}</b><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div>`}
function renderTreatments(){return `<div class="card"><h2>Beauty-Treatments ✨</h2>${[['Professionelle Peelings','Textur, Pigment, Glow','später / individuell'],['Microneedling','Hautstruktur und feine Linien','später / individuell'],['Fraktionierter Laser','stärkerer Ansatz für Textur/feine Linien','später / fachärztlich'],['Botulinumtoxin','Mimische Stirn-/Zornesfalten','optional nach Kinderwunsch & Stillzeit'],['Filler','Volumenverlust / konkrete Vertiefungen','nicht prophylaktisch']].map(t=>`<div class="treat"><h3>${t[0]}</h3><p>${t[1]}</p><span class="pill">${t[2]}</span></div>`).join('')}</div><div class="card"><h3>Natürlichkeits-Regel</h3><p>Konservativ starten, ein Ziel nach dem anderen behandeln, ausreichend Abstand lassen und natürliche Mimik erhalten.</p></div><div class="notice">Bei Schwangerschaft/Stillzeit kosmetische Eingriffe nicht einfach aus der App ableiten; mit der behandelnden Fachperson klären.</div>`}
function renderSettings(){return `<div class="card"><h2>💾 Daten</h2><p class="muted">Alles bleibt lokal im Browser. Exportiere regelmäßig ein Backup.</p><div class="row"><button class="primary" id="export">⬇️ Backup exportieren</button><label class="secondary import">⬆️ Backup importieren<input id="import" type="file" accept="application/json"></label></div></div><div class="card"><h2>🔒 Sicherheitsprinzip</h2><p>Die Produktanalyse ist eine konservative Heuristik, keine medizinische Diagnose. Bei unvollständiger INCI wird nicht behauptet, ein Produkt sei sicher.</p></div>`}
function render(){nav();const app=document.getElementById('app');app.innerHTML=state.tab==='today'?renderToday():state.tab==='week'?renderWeek():state.tab==='products'?renderProducts():state.tab==='shopping'?renderShopping():state.tab==='roadmap'?renderRoadmap():state.tab==='treatments'?renderTreatments():renderSettings();bind()}
function bind(){
const phase=document.getElementById('phase');if(phase)phase.onchange=()=>{state.phase=phase.value;save();render()};
document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{state.checks[e.dataset.check]=e.checked;save()});
document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{state.tab='shopping';save();render()});
const ja=document.getElementById('journalAdd');if(ja)ja.onclick=()=>{const note=prompt('Kurze Notiz zu deiner Haut heute (optional):','')||'';state.journal=[{date:new Date().toISOString().slice(0,10),note},...state.journal.filter(x=>x.date!==new Date().toISOString().slice(0,10))];save();render();toast('Haut-Tagebuch aktualisiert.')};
document.querySelectorAll('[data-delete]').forEach(e=>e.onclick=()=>{const p=state.products.find(x=>x.id===e.dataset.delete);if(p&&confirm('„'+p.name+'“ wirklich aus deiner Sammlung ausmisten?')){state.products=state.products.filter(x=>x.id!==p.id);save();render();toast('Produkt ausgemistet.') }});
document.querySelectorAll('[data-toggle]').forEach(e=>e.onclick=()=>{state.products=state.products.map(p=>p.id===e.dataset.toggle?{...p,active:!p.active}:p);save();render()});
document.querySelectorAll('[data-buy]').forEach(e=>e.onclick=()=>{const p=state.products.find(x=>x.id===e.dataset.buy);if(p){state.shopping=[{id:'shop-'+Date.now(),name:p.name.replace(/\s*\\(Neu kaufen\\)/i,''),reason:'Für deine Routine vorgemerkt.',priority:'hoch',tags:p.tags||[],bought:false},...state.shopping];save();toast('Auf Einkaufsliste gesetzt.')}});
document.querySelectorAll('[data-bought]').forEach(e=>e.onclick=()=>{state.shopping=state.shopping.map(x=>x.id===e.dataset.bought?{...x,bought:true}:x);save();render()});
const si=document.getElementById('shopAdd');if(si)si.onclick=()=>{const inp=document.getElementById('shopInput'),v=inp.value.trim();if(!v)return;state.shopping=[{id:'shop-'+Date.now(),name:v,reason:'Von dir vorgemerkt.',priority:'mittel',tags:[],bought:false},...state.shopping];save();inp.value='';render();toast('Zur Einkaufsliste hinzugefügt.')};
const filter=document.getElementById('filter');if(filter)filter.oninput=()=>{const q=filter.value.toLowerCase();document.querySelectorAll('[data-product]').forEach(e=>e.style.display=e.dataset.product.includes(q)?'':'none')};
const analyzeBtn=document.getElementById('analyze');if(analyzeBtn)analyzeBtn.onclick=()=>{const n=document.getElementById('pname').value.trim(),i=document.getElementById('inci').value.trim();if(!n){toast('Bitte zuerst einen Produktnamen eingeben.');return}showAnalysis(n,i)};
const photo=document.getElementById('photo');if(photo)photo.onchange=()=>{const f=photo.files[0];if(!f)return;const area=document.getElementById('photoArea');area.innerHTML=`<div class="photoBox"><img src="${URL.createObjectURL(f)}" alt="Etikett"><div><b>${esc(f.name)}</b><br><button class="secondary small" id="ocrBtn">📖 Foto auslesen</button></div></div>`;document.getElementById('ocrBtn').onclick=()=>ocr(f)};
const ex=document.getElementById('export');if(ex)ex.onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='my-skin-os-backup.json';a.click()};
const im=document.getElementById('import');if(im)im.onchange=()=>{const f=im.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render();toast('Backup importiert.')}catch{toast('Backup konnte nicht gelesen werden.')}};r.readAsText(f)};
}
function showAnalysis(n,i){const a=analyze(n,i);document.getElementById('analysis').innerHTML=`<div class="analysis"><h3>${a.blocked?'⚠️ Pausieren empfohlen':'✨ '+esc(a.slot)}</h3><p><b>Kategorie:</b> ${esc(a.cat)}</p><p><b>Erkannt:</b> ${a.tags.map(t=>`<span class="pill">${esc(tagMeta[t]||t)}</span>`).join('')||'noch nichts Eindeutiges'}</p><p>${esc(a.reason)}</p>${a.conflicts.map(c=>`<p class="warning">⚠️ ${esc(c)}</p>`).join('')}<div class="row"><button class="primary" id="acceptProduct">Übernehmen</button><button class="secondary" id="discardAnalysis">Verwerfen</button></div></div>`;document.getElementById('acceptProduct').onclick=()=>{state.products.unshift({id:'p-'+Date.now(),name:n,inci:i,cat:a.cat,tags:a.tags,state:a.blocked?'pausiert – Lebensphase':'neu · vorgeschlagen',active:!a.blocked,owned:true,needed:false,source:'Scanner'});save();render();toast('Produkt gespeichert.')};document.getElementById('discardAnalysis').onclick=()=>document.getElementById('analysis').innerHTML=''}
async function ocr(file){const area=document.getElementById('photoArea');area.innerHTML+='<p class="muted" id="ocrStatus">📖 OCR wird geladen…</p>';try{if(!window.Tesseract){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}const r=await Tesseract.recognize(file,'eng',{logger:m=>{const el=document.getElementById('ocrStatus');if(el&&m.status)el.textContent='📖 '+m.status+' '+(m.progress?Math.round(m.progress*100)+'%':'')}});const text=r.data.text||'';document.getElementById('inci').value=text;const lines=text.split(/\\n+/).map(x=>x.trim()).filter(Boolean);if(lines[0])document.getElementById('pname').value=lines[0].slice(0,100);const el=document.getElementById('ocrStatus');if(el)el.textContent='✅ Text erkannt – bitte prüfen und dann analysieren.'}catch(e){const el=document.getElementById('ocrStatus');if(el)el.textContent='⚠️ OCR konnte nicht geladen werden. Bitte Name/INCI manuell eintragen.'}}
render();
</script>
</body>
</html>
